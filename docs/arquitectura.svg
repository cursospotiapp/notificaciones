<text x="64" y="94" class="" font-size="34" font-weight="700">Una notificación. Múltiples destinos.</text>
<text x="64" y="126" class="" font-size="17" style="fill:#53647b" >Publicación asíncrona · Despacho por canal · Recuperación ante fallos</text>
