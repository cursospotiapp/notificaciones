<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura del sistema de notificaciones</title>
  <desc id="description">Los productores publican eventos en RabbitMQ. Las colas email y webhook alimentan consumidores que validan el contrato y comprueban la idempotencia antes de despachar a SMTP o HTTP. Los fallos transitorios vuelven al exchange tras un TTL; los errores definitivos terminan en la DLQ. Elasticsearch recibe logs opcionalmente.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #182840; }
      .label { font-size: 17px; font-weight: 600; }
      .small { font-size: 14px; fill: #53647b; }
      .mono { font-family: Consolas, monospace; font-size: 14px; }
      .edge { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#152c4c" flood-opacity="0.06"/></filter>
  </defs>
<defs><marker id="main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#607491" stroke-width="1.6"/></marker></defs>
<defs><marker id="retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b66a0c" stroke-width="1.6"/></marker></defs>
<defs><marker id="fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c34a61" stroke-width="1.6"/></marker></defs>
<defs><marker id="logs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c8798" stroke-width="1.6"/></marker></defs>
<rect x="0" y="0" width="1600" height="960" rx="24" fill="#f7f9fc" stroke="none" />
<rect x="40" y="40" width="5" height="65" rx="2" fill="#5263d6" stroke="none" />
