<rect x="370" y="184" width="32" height="30" rx="9" fill="#ffffff" stroke="none" />
<text x="386" y="205" class="" font-size="13" style="fill:#ad6a13" text-anchor="middle" font-weight="700">02</text>
<text x="414" y="205" class="label" style="fill:#ad6a13" >RabbitMQ</text>
<text x="370" y="240" class="small" >Enruta y almacena</text>
<rect x="690" y="166" width="500" height="474" rx="18" fill="#eaf6f2" stroke="none" />
<rect x="710" y="184" width="32" height="30" rx="9" fill="#ffffff" stroke="none" />
<text x="726" y="205" class="" font-size="13" style="fill:#247b65" text-anchor="middle" font-weight="700">03</text>
<text x="754" y="205" class="label" style="fill:#247b65" >Servicio de notificaciones</text>
<text x="710" y="240" class="small" >Consume, valida y despacha</text>
